<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Clicker Mini-Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>The Arcade Clicker Game</h1>
        <p>Test your clicking speed! Hit the button as many times as you can.</p>
        <div class="score-board">
            <h3>Total Clicks: <span id="counterDisplay">0</span></h3>
        </div>
        <div class="action-area">
            <button id="hitBtn" class="btn click-btn">CLICK ME!</button>
            <button id="clearBtn" class="btn reset-btn">Reset Score</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
