<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form with Validation</title>
    <link rel="stylesheet" href="form-style.css">
</head>
<body>
    <nav class="navbar">
        <span class="nav-logo">Student Portal</span>
        <button id="modeToggleBtn">Switch to Dark Mode</button>
    </nav>
    <div class="form-container">
        <h2>Create Account</h2>
        <p class="subtitle">Please fill out all the fields below to register.</p>
        <hr>

        <form id="registrationForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your name">
                <span id="nameError" class="error-msg"></span>
            </div>
            <div class="form-group">
                <label for="emailAddr">Email Address</label>
                <input type="text" id="emailAddr" placeholder="example@gmail.com">
                <span id="emailError" class="error-msg"></span>
            </div>
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" placeholder="10-digit mobile number">
                <span id="phoneError" class="error-msg"></span>
            </div>
            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <input type="radio" name="userGender" value="Male" id="maleOpt"> 
                    <label for="maleOpt" class="radio-label">Male</label>
                    
                    <input type="radio" name="userGender" value="Female" id="femaleOpt"> 
                    <label for="femaleOpt" class="radio-label">Female</label>
                </div>
                <span id="genderError" class="error-msg"></span>
            </div>
            <div class="form-group">
                <label for="deptSelect">Department</label>
                <select id="deptSelect">
                    <option value="">-- Choose Branch --</option>
                    <option value="CSE">Computer Science Engineering</option>
                    <option value="ECE">Electronics</option>
                    <option value="ME">Mechanical</option>
                </select>
                <span id="deptError" class="error-msg"></span>
            </div>
            <div class="form-group">
                <label for="passField">Password</label>
                <input type="password" id="passField" placeholder="Create password">
                <span id="passError" class="error-msg"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassField">Confirm Password</label>
                <input type="password" id="confirmPassField" placeholder="Re-enter password">
                <span id="confirmPassError" class="error-msg"></span>
            </div>
            <button type="submit" class="submit-btn">Submit Registration</button>
        </form>
    </div>

    <script src="form-script.js"></script>
</body>
</html>
